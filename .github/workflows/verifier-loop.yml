# DRAFT (unpublished). P2: the privileged workflow stays in the verifier-controlled PUBLIC repo; the agent holds no credential for this repo, so it cannot alter this file,
# the verifier code, the trust anchor/pin, or any input of this job. Add via the GitHub web UI to telesty-tpicc/tpicc-verifier at .github/workflows/verifier-loop.yml
# How it works: a run polls the private work repo for submit/* branches about every minute for ~40 minutes (GitHub App tokens last 1 hour), then starts the next run
# with this repository's own GITHUB_TOKEN. No agent-controlled event, file or secret is involved in triggering. Hourly cron and manual Run are fallbacks only.
# Any failed cycle stops the chain (fail closed); nothing restarts it except the hourly cron or the Owner.
name: verifier-loop
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}
concurrency:
  group: verifier-cycle
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  cycle:
    if: github.repository == 'telesty-tpicc/tpicc-verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # Only this repository's own verifier code is checked out. No candidate content is ever checked out or executed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - id: org
        uses: actions/create-github-app-token@af35edadc00be37caa72ed9f3e6d5f7801bfdf09  # v1.11.7
        with:
          app-id: ${{ vars.VERIFIER_APP_ID }}
          private-key: ${{ secrets.VERIFIER_APP_KEY }}
          owner: telesty-tpicc
          repositories: tpicc-agent-work,tpicc-verifier,tpicc-mission-records
      - id: real
        uses: actions/create-github-app-token@af35edadc00be37caa72ed9f3e6d5f7801bfdf09  # v1.11.7
        with:
          app-id: ${{ vars.PROMOTER_APP_ID }}
          private-key: ${{ secrets.PROMOTER_APP_KEY }}
          owner: btsevers
          repositories: ${{ vars.REAL_REPO_NAME }}
      # Fail-closed scope assertions (replace screenshot checks). Unscoped tokens expose the FULL installation: the repository set must be exactly
      # what P1 specifies and the installation must hold no permission beyond contents. Prints PASS/FAIL only (public logs); no names, no values.
      - id: org_all
        uses: actions/create-github-app-token@af35edadc00be37caa72ed9f3e6d5f7801bfdf09  # v1.11.7
        with:
          app-id: ${{ vars.VERIFIER_APP_ID }}
          private-key: ${{ secrets.VERIFIER_APP_KEY }}
          owner: telesty-tpicc
      - id: real_all
        uses: actions/create-github-app-token@af35edadc00be37caa72ed9f3e6d5f7801bfdf09  # v1.11.7
        with:
          app-id: ${{ vars.PROMOTER_APP_ID }}
          private-key: ${{ secrets.PROMOTER_APP_KEY }}
          owner: btsevers
      - name: assert installation scope
        env:
          ORG_TOKEN: ${{ steps.org_all.outputs.token }}
          REAL_TOKEN: ${{ steps.real_all.outputs.token }}
          REAL_REPO_NAME: ${{ vars.REAL_REPO_NAME }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          def call(path, tok):
              r = urllib.request.Request("https://api.github.com" + path, headers={"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(r, timeout=30) as x: return x.status, json.load(x)
              except urllib.error.HTTPError as e: return e.code, {}
          bad = []
          st, d = call("/installation/repositories?per_page=100", os.environ["ORG_TOKEN"])
          org = sorted(x["name"] for x in d.get("repositories", [])) if st == 200 else None
          if org != sorted(["tpicc-agent-work", "tpicc-mission-records", "tpicc-verifier"]): bad.append("org-repo-set")
          st, d = call("/installation/repositories?per_page=100", os.environ["REAL_TOKEN"])
          real = sorted(x["name"] for x in d.get("repositories", [])) if st == 200 else None
          if real != [os.environ["REAL_REPO_NAME"]]: bad.append("promoter-repo-set")
          # permission probes: each must be refused (403/404) for a contents-only installation
          for tag, tok, repo in (("org", os.environ["ORG_TOKEN"], "telesty-tpicc/tpicc-agent-work"), ("promoter", os.environ["REAL_TOKEN"], "btsevers/" + os.environ["REAL_REPO_NAME"])):
              for probe in ("issues", "pulls", "actions/workflows", "actions/secrets", "hooks", "keys", "environments", "pages"):
                  code, _ = call("/repos/%s/%s" % (repo, probe), tok)
                  if code not in (403, 404): bad.append("%s-%s-%s" % (tag, probe.replace("/", "_"), code))
          print("SCOPE", "PASS" if not bad else "FAIL " + ",".join(bad))
          sys.exit(0 if not bad else 1)
          PY
      - name: poll and run cycles (about 40 minutes)
        env:
          WORK_URL: https://x-access-token:${{ steps.org.outputs.token }}@github.com/telesty-tpicc/tpicc-agent-work.git
          LEDGER_URL: https://x-access-token:${{ steps.org.outputs.token }}@github.com/telesty-tpicc/tpicc-verifier.git
          RECORDS_URL: https://x-access-token:${{ steps.org.outputs.token }}@github.com/telesty-tpicc/tpicc-mission-records.git
          REAL_URL: https://x-access-token:${{ steps.real.outputs.token }}@github.com/btsevers/${{ vars.REAL_REPO_NAME }}.git
          ANCHOR_PATH: ${{ vars.ANCHOR_PATH }}
          ANCHOR_PIN: ${{ vars.ANCHOR_PIN }}
        run: |
          set -e
          for i in $(seq 1 40); do
            python3 cycle.py
            sleep 60
          done
      - name: start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verifier-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
